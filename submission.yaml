submission:
  title: "PortsPilot AI"                # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Global container ports face severe supply chain bottlenecks — such as the 2021 LA/Long Beach crisis with 100+ ships waiting offshore costing $10B+ — because berth and yard allocations are handled reactively in manual spreadsheets. Port operators and harbor masters discover congestion only after queues form, leaving no time for proactive vessel diversion or optimal crane scheduling.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    PortsPilot AI is an enterprise maritime operations command center that predicts quayside bottlenecks 6 to 72 hours ahead, solves the Berth Allocation Problem and Crane Assignment Problem (BAP/CAP), provides alternate port diversion intelligence, automates 72-hour stevedore shift planning, and assists operators with an interactive IBM Bob / Gemini AI copilot.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Predictive 72-Hour Congestion Hotspot Engine with multi-horizon forecast curves and root-cause driver attribution"
    - "BAP/CAP Operations Optimizer minimizing vessel wait hours, crane clashes, and demurrage penalties"
    - "Alternate Port Diversion Intelligence evaluating fuel expenditure, nautical distance, and downstream congestion"
    - "72-Hour Stevedore Shift & Crane Planner with automated conflict detection and one-click resolution"
    - "Conversational AI Operations Copilot (IBM Bob / Gemini) for natural-language telemetry reasoning and recovery actions"

  tech_stack:
    languages: ["TypeScript", "Python", "SQL"]
    frameworks: ["React 18", "Vite 6", "FastAPI", "Hono", "Tailwind CSS", "Prisma ORM"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Cloud Code Engine"]
    databases: ["PostgreSQL", "Supabase"]
    other: ["Docker", "Recharts", "Lucide React", "Three.js", "Pytest"]

  what_we_are_most_proud_of: >
    The seamless integration between predictive forecasting (6h–72h), algorithmic BAP/CAP optimization with quantifiable demurrage reduction, and an intuitive copilot that empowers port supervisors to simulate disruptions and apply multi-module recovery plans with confidence.

  known_limitations: >
    Vessel AIS telemetry currently leverages high-fidelity simulated feeds for real-time demonstration; dynamic bathymetric tide curves are modeled through discrete draught constraints rather than continuous hydrodynamic sensor streams.

